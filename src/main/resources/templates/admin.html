<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | FoodBridge</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav class="nav"><a class="logo" th:href="@{/}">🍱 FoodBridge</a><div><span th:text="${user.organizationName}">Admin</span><form class="inline" method="post" th:action="@{/logout}"><button class="link-button">Logout</button></form></div></nav><main class="dashboard"><span class="eyebrow">ADMIN CONTROL CENTER</span><h1>Platform overview</h1><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="grid three"><article class="stat"><span>Restaurants</span><strong th:text="${restaurantCount}">0</strong></article><article class="stat"><span>NGOs</span><strong th:text="${ngoCount}">0</strong></article><article class="stat"><span>Completed donations</span><strong th:text="${completedCount}">0</strong></article></div><div class="panel"><h2>Pending NGO verification</h2><div class="table-scroll"><table><thead><tr><th>Organization</th><th>Email</th><th>Location</th><th>Action</th></tr></thead><tbody><tr th:each="u:${pendingNgos}"><td th:text="${u.organizationName}"></td><td th:text="${u.email}"></td><td th:text="${u.location}"></td><td><form method="post" th:action="@{/admin/verify/{id}(id=${u.id})}"><button class="btn small-btn">Verify NGO</button></form></td></tr><tr th:if="${#lists.isEmpty(pendingNgos)}"><td colspan="4">No NGOs waiting for verification.</td></tr></tbody></table></div></div><div class="panel"><h2>Registered users</h2><div class="table-scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Location</th><th>Verified</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.organizationName}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td th:text="${u.location}"></td><td th:text="${u.verified?'Yes':'No'}"></td></tr></tbody></table></div></div><div class="panel"><h2>All donations</h2><div class="table-scroll"><table><thead><tr><th>Food</th><th>Restaurant</th><th>NGO</th><th>Quantity</th><th>Status</th></tr></thead><tbody><tr th:each="d:${donations}"><td th:text="${d.foodName}"></td><td th:text="${d.restaurant.organizationName}"></td><td th:text="${d.ngo != null ? d.ngo.organizationName : '—'}"></td><td th:text="${d.quantity+' '+d.unit}"></td><td th:text="${d.status}"></td></tr></tbody></table></div></div></main></body></html>
