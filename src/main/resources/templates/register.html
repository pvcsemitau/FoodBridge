<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | FoodBridge</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav class="nav"><a class="logo" th:href="@{/}">🍱 FoodBridge</a><a th:href="@{/login}">Login</a></nav><main class="auth"><h1>Join FoodBridge</h1><p>Create an account for your organization.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/register}"><label>Organization name<input name="organizationName" maxlength="120" required></label><label>Location<input name="location" maxlength="160" placeholder="Area / city" required></label><label>Email<input type="email" name="email" maxlength="190" required></label><label>Password<input type="password" name="password" minlength="8" required><small>Use at least 8 characters.</small></label><label>Account type<select name="role" required><option value="RESTAURANT">Restaurant / Café</option><option value="NGO">NGO / Charity / Shelter</option></select></label><button class="btn full">Create account</button></form><p class="small">NGO accounts require admin verification before accepting donations.</p></main></body></html>
