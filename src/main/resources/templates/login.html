<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | FoodBridge</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav class="nav"><a class="logo" th:href="@{/}">🍱 FoodBridge</a><a th:href="@{/register}">Create account</a></nav><main class="auth"><h1>Welcome back</h1><p>Sign in to your FoodBridge account.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="alert success" th:if="${success}" th:text="${success}"></div><form method="post" th:action="@{/login}"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn full">Sign in</button></form><p class="small">New to FoodBridge? <a th:href="@{/register}">Register here</a></p></main></body></html>
